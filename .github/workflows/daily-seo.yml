name: Daily Autonomous SEO Agent

on:
  schedule:
    # Runs at 13:00 UTC every day (9:00 AM EST / 6:00 AM PST - USA morning)
    - cron: '0 13 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-seo-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Daily SEO Agent Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python daily_seo_agent.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Auto-generated 2 daily articles via SEO Agent" || echo "No changes to commit"
          git push
