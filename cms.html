<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Preconnect and Preload Google Fonts for PageSpeed -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <title>LearnHarmonium Pro CMS (Local Only)</title>
  <link rel="stylesheet" href="index.css" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#141414">
  
  <style>
    body { background: var(--bg-primary); padding: 40px 20px; }
    .cms-container { max-width: 1000px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid var(--border); padding-bottom: 20px; }
    
    .status-panel { padding: 20px; background: var(--secondary); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
    .status-panel .status { display: flex; align-items: center; gap: 10px; font-weight: 500; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; }
    .dot.connected { background: var(--cta); }
    
    .articles-list { display: flex; flex-direction: column; gap: 12px; }
    .article-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; }
    .article-info h4 { margin: 0 0 4px 0; color: var(--text-primary); }
    .article-info p { margin: 0; font-size: 13px; color: var(--text-secondary); }
    .article-actions button { background: none; border: none; color: var(--accent-gold); cursor: pointer; padding: 6px 12px; border-radius: 4px; font-weight: 500; }
    .article-actions button:hover { background: rgba(212,175,55,0.1); }
    
    /* Expanded Modal for Pro CMS */
    .modal { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.9); backdrop-filter: blur(8px); z-index: 1000; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 20px; }
    .modal.open { display: flex; }
    .modal-content { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 12px; padding: 32px; width: 100%; max-width: 900px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); margin: auto; }
    
    .form-group { margin-bottom: 24px; position: relative; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--secondary); color: var(--text-primary); font-family: inherit; font-size: 15px; }
    .form-group input:focus, .form-group textarea:focus { outline: 1px solid var(--accent-gold); border-color: var(--accent-gold); }
    
    .char-count { position: absolute; right: 0; top: 0; font-size: 12px; color: var(--text-secondary); font-weight: normal; }
    .char-count.error { color: #ef4444; font-weight: bold; }
    
    .section-title { margin-top: 32px; margin-bottom: 16px; font-size: 18px; color: var(--accent-gold); border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    
    .btn-danger { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #ef4444; }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.2); }
    
    .html-editor { font-family: monospace !important; font-size: 14px !important; line-height: 1.6 !important; background: #0f172a !important; border: 1px solid #1e293b !important; }
  </style>
</head>
<body>

  <script>
    if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      document.body.innerHTML = `
        <div style="text-align:center; padding: 100px;">
          <h1 style="color:#ef4444;margin-bottom:16px">🔒 Access Denied</h1>
          <p>The CMS is only available on a local development server.</p>
        </div>
      `;
      throw new Error("CMS access denied on public domain.");
    }
  </script>

  <div class="cms-container">
    <div class="header">
      <div>
        <h1 style="margin: 0; font-size: 28px;">LearnHarmonium <span class="text-gold">Pro CMS</span></h1>
        <p style="margin: 4px 0 0; color: var(--text-secondary);">Static Site Generator • Google Drive Images • SEO Metadata</p>
      </div>
      <a href="/" class="btn btn-outline">Back to Site</a>
    </div>

    <div class="status-panel">
      <div class="status">
        <div class="dot" id="connDot"></div>
        <span id="connStatus">Not connected to project directory</span>
      </div>
      <button class="btn btn-gold" id="btnConnect">Connect to learnharmonium Folder</button>
    </div>

    <div id="contentPanel" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3 style="margin: 0;">Articles (<span id="articleCount">0</span>)</h3>
        <button class="btn btn-cta" id="btnNewArticle">+ New Article</button>
      </div>
      <div class="articles-list" id="articlesList"></div>
    </div>
  </div>

  <!-- Modal for Adding/Editing -->
  <div class="modal" id="articleModal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h3 style="margin: 0;" id="modalTitle">Add Article</h3>
        <button id="btnCloseModal" style="background:none;border:none;color:var(--text-secondary);font-size:24px;cursor:pointer;">&times;</button>
      </div>
      
      <form id="articleForm">
        <input type="hidden" id="editIndex" value="-1" />
        
        <h4 class="section-title" style="margin-top: 0;">1. Basic Info</h4>
        
        <div class="form-group">
          <label>Article Title (H1)</label>
          <input type="text" id="fTitle" required placeholder="e.g. Learn Raag Yaman on Harmonium" />
        </div>
        
        <div style="display: flex; gap: 16px;">
          <div class="form-group" style="flex: 1;">
            <label>URL Slug (auto-generated)</label>
            <input type="text" id="fSlug" required placeholder="e.g. raag-yaman" />
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Read Time</label>
            <input type="text" id="fReadTime" required placeholder="e.g. 5 min read" />
          </div>
        </div>
        
        <div style="display: flex; gap: 16px;">
          <div class="form-group" style="flex: 1;">
            <label>Category</label>
            <input type="text" id="fCategory" required placeholder="e.g. Raag" list="catList" />
            <datalist id="catList">
              <option value="Beginner"></option><option value="Practice"></option>
              <option value="Theory"></option><option value="Raag"></option>
              <option value="Songs"></option><option value="Scales"></option>
            </datalist>
          </div>
          <div class="form-group" style="flex: 1;">
            <label>Difficulty</label>
            <select id="fDifficulty" required>
              <option value="Beginner">Beginner</option>
              <option value="Intermediate">Intermediate</option>
              <option value="Advanced">Advanced</option>
            </select>
          </div>
        </div>

        <h4 class="section-title">2. SEO Metadata</h4>

        <div class="form-group">
          <label>Meta Title <span class="char-count" id="countMetaTitle">0 / 60</span></label>
          <input type="text" id="fMetaTitle" required placeholder="SEO title (appears in Google search results)" />
        </div>
        
        <div class="form-group">
          <label>Meta Description <span class="char-count" id="countMetaDesc">0 / 160</span></label>
          <textarea id="fMetaDesc" rows="2" required placeholder="A compelling description for Google search results..."></textarea>
        </div>
        
        <div class="form-group">
          <label>Keywords (comma separated)</label>
          <input type="text" id="fKeywords" required placeholder="e.g. raag yaman, harmonium, evening raag" />
        </div>

        <h4 class="section-title">3. Content & Media</h4>

        <div class="form-group">
          <label>Featured Image (Google Drive Share Link) <span style="font-weight:normal;color:var(--text-secondary);font-size:12px;">Optional</span></label>
          <input type="url" id="fDriveImage" placeholder="https://drive.google.com/file/d/XYZ/view" />
          <p style="font-size:12px;color:var(--accent-gold);margin-top:6px;margin-bottom:0;">CMS will auto-convert this to a fast direct-embed link.</p>
        </div>

        <div class="form-group">
          <label>Card Excerpt</label>
          <textarea id="fExcerpt" rows="2" required placeholder="Short summary for the article cards on the homepage..."></textarea>
        </div>

        <div class="form-group">
          <label>Article Content (HTML)</label>
          <textarea id="fContent" rows="12" class="html-editor" required placeholder="<p>Write your article here...</p>&#10;&#10;<h2>Section Heading</h2>&#10;<p>More content...</p>"></textarea>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--border);">
          <button type="button" class="btn btn-danger" id="btnDelete" style="display:none;">Delete Article</button>
          <div style="margin-left: auto; display: flex; gap: 12px; align-items: center;">
            <span id="saveStatus" style="font-size:13px;color:var(--text-secondary);display:none;">Generating HTML...</span>
            <button type="button" class="btn btn-outline" id="btnCancel">Cancel</button>
            <button type="submit" class="btn btn-cta" id="btnSave">Save &amp; Generate HTML</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="js/cms.js" defer></script>
</body>
</html>
